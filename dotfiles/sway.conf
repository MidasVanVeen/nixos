set $mod Mod4
set $term kitty
set $menu wofi --show drun --no-actions

output eDP-1 scale 1.5

seat * xcursor_theme Adwaita 24

font pango:JetBrainsMono Nerd Font 10
default_border pixel 1
gaps inner 0
gaps outer 0
smart_gaps off

client.focused          #555555 #555555 #000000 #555555 #555555
client.focused_inactive #222222 #222222 #ffffff #222222 #222222
client.unfocused        #000000 #000000 #888888 #000000 #000000

input * {
    xkb_options ctrl:nocaps
    repeat_delay 200
    repeat_rate 30
}
input type:touchpad {
    dwt disabled
    natural_scroll enabled
}

exec_always dbus-update-activation-environment --systemd WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP
exec_always systemctl --user import-environment WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP
exec waybar
exec mako
exec nm-applet --indicator
exec systemctl --user start polkit-gnome.service
exec swayidle -w timeout 300 'swaylock -f' timeout 600 'swaymsg "output * power off"' resume 'swaymsg "output * power on"' before-sleep 'swaylock -f'

bindsym $mod+Return exec $term
bindsym $mod+space exec $menu
bindsym $mod+Shift+s exec grimshot copy area
bindsym $mod+Shift+e exec swaynag -t warning -m 'Exit Sway?' -b 'Yes' 'swaymsg exit'
bindsym $mod+Shift+r reload
bindsym $mod+Escape exec swaylock -f

set $codex_term kitty --app-id codex-term --directory ~/Downloads sh -lc codex
for_window [app_id="codex-term"] floating enable, resize set width 1200 px height 800 px, move position center, move to scratchpad
bindsym $mod+c exec sh -c 'swaymsg [app_id="codex-term"] scratchpad show || kitty --app-id codex-term --directory ~/Downloads sh -lc codex'

set $shell_term kitty --app-id shell-term
for_window [app_id="shell-term"] floating enable, resize set width 1200 px height 800 px, move position center, move to scratchpad
bindsym $mod+s exec sh -c 'swaymsg [app_id="shell-term"] scratchpad show || kitty --app-id shell-term'

bindsym --locked XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindsym --locked XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym --locked XF86AudioRaiseVolume exec wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindsym --locked XF86AudioMicMute exec wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindsym --locked XF86AudioPlay exec playerctl play-pause
bindsym --locked XF86AudioNext exec playerctl next
bindsym --locked XF86AudioPrev exec playerctl previous
bindsym --locked XF86MonBrightnessUp exec brightnessctl set +2%
bindsym --locked XF86MonBrightnessDown exec brightnessctl set 2%-
bindsym --locked XF86KbdBrightnessUp exec brightnessctl -d kbd_backlight set +2%
bindsym --locked XF86KbdBrightnessDown exec brightnessctl -d kbd_backlight set 2%-

bindsym $mod+q kill
bindsym $mod+f fullscreen toggle
bindsym $mod+Shift+space floating toggle
floating_modifier $mod normal
bindsym $mod+o [floating] opacity minus 0.05
bindsym $mod+Shift+o [floating] opacity plus 0.05

bindsym $mod+h focus left
bindsym $mod+j focus down
bindsym $mod+k focus up
bindsym $mod+l focus right
bindsym $mod+Shift+h move left
bindsym $mod+Shift+j move down
bindsym $mod+Shift+k move up
bindsym $mod+Shift+l move right
bindsym $mod+b splith
bindsym $mod+v splitv
bindsym $mod+e layout toggle split

mode "resize" {
    bindsym h resize shrink width 20px
    bindsym j resize grow height 20px
    bindsym k resize shrink height 20px
    bindsym l resize grow width 20px
    bindsym Return mode "default"
    bindsym Escape mode "default"
}
bindsym $mod+r mode "resize"

set $ws1 "1"
set $ws2 "2"
set $ws3 "3"
set $ws4 "4"
set $ws5 "5"
set $ws6 "6"
set $ws7 "7"
set $ws8 "8"
set $ws9 "9"
set $ws10 "10"

bindsym $mod+1 workspace $ws1
bindsym $mod+2 workspace $ws2
bindsym $mod+3 workspace $ws3
bindsym $mod+4 workspace $ws4
bindsym $mod+5 workspace $ws5
bindsym $mod+6 workspace $ws6
bindsym $mod+7 workspace $ws7
bindsym $mod+8 workspace $ws8
bindsym $mod+9 workspace $ws9
bindsym $mod+0 workspace $ws10
bindsym $mod+Shift+1 move container to workspace $ws1
bindsym $mod+Shift+2 move container to workspace $ws2
bindsym $mod+Shift+3 move container to workspace $ws3
bindsym $mod+Shift+4 move container to workspace $ws4
bindsym $mod+Shift+5 move container to workspace $ws5
bindsym $mod+Shift+6 move container to workspace $ws6
bindsym $mod+Shift+7 move container to workspace $ws7
bindsym $mod+Shift+8 move container to workspace $ws8
bindsym $mod+Shift+9 move container to workspace $ws9
bindsym $mod+Shift+0 move container to workspace $ws10

include /etc/sway/config.d/*
